<title>Hint companion</title>
<!-- Player-facing hint page from backpack-kit. kit.py build inlines the style, helpers and data,
     so this one file is all a player's phone needs. Only hint text and solutions are included.
     With "stats" in backpack.json, runs are logged to that API (see sync.js), teammates can join
     a run with its game code, and the end screen compares the team with earlier teams. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Inter+Tight:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Look follows escapepack.ca: light paper with forest headings and rust accents, plus a
   forest-green dark mode. Toggle and theme storage live in common.js (key "ebp-theme"). */
:root {
  /* Light is the default and matches escapepack.ca (paper, forest ink, rust accents).
     Names keep their old dark-theme meaning: --forest is the page, --cream the text. */
  --forest: #f3eadb; --forest-2: #fbf7ee; --forest-deep: #e9ddca;
  --cream: #20392e; --cream-3: #3d5648; --muted: #65776b;
  --brass: #17372d; --brass-2: #b95b3d; --rust: #b95b3d; --rust-2: #a04a2f; --on-rust: #fff;
  --line: rgba(32, 57, 46, 0.17); --line-strong: rgba(32, 57, 46, 0.34);
  --s-idea: #8a7f6d; --s-candidate: #a87424; --s-decided: #2f7590; --s-built: #4a7f38;
  --s-parked: #b95b3d; --s-open: #a87424; --s-answered: #4a7f38; --s-superseded: #9a917f;
  --warn: #b95b3d; --stale: #a87424;
  --nav-bg: rgba(247, 241, 230, .94); --glow-1: rgba(214,173,107,.10); --glow-2: rgba(185,91,61,.05);
  --flow-a: #e3efe6; --flow-b: #fbf7ee; --flow-stroke: #5f8a70; --flow-block: #b95b3d;
  --flow-id: #8a5f1c; --flow-title: #20392e; --flow-status: #3d5648; --flow-needs: #a87424; --flow-use: #4f7d63;
  --serif: "Young Serif", "Cormorant Garamond", Georgia, serif;
  --sans: "Inter Tight", "Inter", -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  color-scheme: light;
}
/* Dark: forest-green page. Applies when the visitor picked it, or the OS prefers it and they haven't picked light. */
:root[data-theme="dark"] {
  --forest: #17372d; --forest-2: #214b3d; --forest-deep: #10291f;
  --cream: #f7f1e6; --cream-3: #d8ccb4; --muted: #9db0a2;
  --brass: #d6ad6b; --brass-2: #e8c28a; --rust: #b95b3d; --rust-2: #e0805e;
  --line: rgba(244, 237, 224, 0.14); --line-strong: rgba(244, 237, 224, 0.28);
  --s-idea: #a39884; --s-candidate: #d4a668; --s-decided: #8fc1d4; --s-built: #9cc98a;
  --s-parked: #e0805e; --s-open: #d4a668; --s-answered: #9cc98a; --s-superseded: #8b8270;
  --warn: #e0805e; --stale: #e8c28a;
  --nav-bg: rgba(16, 41, 31, .94); --glow-1: rgba(212,166,104,.06); --glow-2: rgba(168,73,43,.05);
  --flow-a: #234b3e; --flow-b: #142e24; --flow-stroke: #77947c; --flow-block: #e8a674;
  --flow-id: #d9b47a; --flow-title: #f6f0e3; --flow-status: #cbd7bd; --flow-needs: #d9b47a; --flow-use: #91b9a3;
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --forest: #17372d; --forest-2: #214b3d; --forest-deep: #10291f;
    --cream: #f7f1e6; --cream-3: #d8ccb4; --muted: #9db0a2;
    --brass: #d6ad6b; --brass-2: #e8c28a; --rust: #b95b3d; --rust-2: #e0805e;
    --line: rgba(244, 237, 224, 0.14); --line-strong: rgba(244, 237, 224, 0.28);
    --s-idea: #a39884; --s-candidate: #d4a668; --s-decided: #8fc1d4; --s-built: #9cc98a;
    --s-parked: #e0805e; --s-open: #d4a668; --s-answered: #9cc98a; --s-superseded: #8b8270;
    --warn: #e0805e; --stale: #e8c28a;
    --nav-bg: rgba(16, 41, 31, .94); --glow-1: rgba(212,166,104,.06); --glow-2: rgba(168,73,43,.05);
    --flow-a: #234b3e; --flow-b: #142e24; --flow-stroke: #77947c; --flow-block: #e8a674;
    --flow-id: #d9b47a; --flow-title: #f6f0e3; --flow-status: #cbd7bd; --flow-needs: #d9b47a; --flow-use: #91b9a3;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--forest); color: var(--cream); }
body { font: 16px/1.55 var(--sans); -webkit-font-smoothing: antialiased; min-height: 100vh;
  background-image: radial-gradient(circle at 20% 20%, var(--glow-1) 0%, transparent 55%),
    radial-gradient(circle at 85% 75%, var(--glow-2) 0%, transparent 50%); background-attachment: fixed; }
a { color: var(--brass); }
a:hover { color: var(--rust-2); }
h1, h2, h3 { font-family: var(--serif); font-weight: 400; color: var(--brass); letter-spacing: -0.01em; line-height: 1.15; }
.eyebrow, .rid, .pill, .flag, .kv, .meta, .legend, .row .when, .sec, .path, .filters, nav a, .made, .btn { font-family: var(--mono); }
.eyebrow { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--rust-2); }
header { display: flex; gap: 16px; align-items: flex-end; justify-content: space-between; flex-wrap: wrap;
  padding: 22px clamp(16px, 4vw, 40px) 16px; max-width: 1260px; margin: 0 auto; }
header h1 { margin: 4px 0 2px; font-size: clamp(1.8rem, 4vw, 2.6rem); }
header .sub { color: var(--muted); font: 12px var(--mono); letter-spacing: .06em; }
#q { width: min(320px, 100%); padding: 10px 14px; border: 1px solid var(--line-strong); border-radius: 3px;
  background: var(--forest-deep); color: var(--cream); font: 15px var(--sans); outline: none; }
#q:focus { border-color: var(--brass); }
#q::placeholder { color: var(--muted); }
nav { display: flex; flex-wrap: wrap; gap: 0 clamp(14px, 2.4vw, 28px);
  padding: 0 max(clamp(16px, 4vw, 40px), calc((100% - 1260px) / 2 + clamp(16px, 4vw, 40px)));
  position: sticky; top: 0; z-index: 5; background: var(--nav-bg); backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px); border-bottom: 2px solid var(--rust); }
nav a { padding: 14px 2px 12px; color: var(--brass); text-decoration: none; white-space: nowrap; position: relative;
  font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
nav a:hover { color: var(--cream); }
nav a.on { color: var(--cream); }
nav a.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: -2px; height: 2px; background: var(--brass); }
nav .n { color: var(--muted); margin-left: 6px; }
main { padding: 24px clamp(16px, 4vw, 40px) 80px; max-width: 1260px; margin: 0 auto; }
h2 { font-size: clamp(1.4rem, 2.6vw, 1.9rem); margin: 38px 0 14px; }
main > h2:first-child { margin-top: 8px; }
h2 .n { color: var(--muted); font: 12px var(--mono); letter-spacing: .08em; margin-left: 6px; vertical-align: middle; }
.empty { color: var(--muted); font-style: italic; padding: 6px 0; }
.note { color: var(--muted); font-size: 14px; margin: 4px 0 16px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.card { background: var(--forest-2); border: 1px solid var(--line); border-radius: 2px; padding: 18px 20px;
  cursor: pointer; display: flex; flex-direction: column; gap: 8px; min-width: 0;
  transition: transform .2s ease, border-color .2s; }
.card:hover { border-color: var(--brass); transform: translateY(-2px); }
.card h3 { margin: 0; font-size: 1.3rem; }
.card.is-stale { border-left: 3px solid var(--stale); }
.top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.rid { font-size: 11px; letter-spacing: .08em; color: var(--muted); }
.pill { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; padding: 2px 8px; border-radius: 2px;
  border: 1px solid currentColor; background: transparent; }
.flag { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; padding: 2px 8px; border-radius: 2px;
  border: 1px dashed var(--stale); color: var(--stale); }
.flag.dirty { border-color: var(--line-strong); color: var(--cream-3); }
.kv { font-size: 11.5px; letter-spacing: .06em; color: var(--muted); text-transform: uppercase; }
.kv b { color: var(--cream); font: 14px var(--sans); text-transform: none; letter-spacing: 0; }
.meta { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-top: auto;
  padding-top: 10px; border-top: 1px solid var(--line); }
.refs { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.refs .lbl { color: var(--muted); font: 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; margin-right: 2px; }
.ref { display: inline-flex; gap: 6px; align-items: center; padding: 2px 8px; border-radius: 2px;
  font: inherit; font-size: 13px; background: var(--forest-deep); border: 1px solid var(--line-strong); color: var(--cream); cursor: pointer; max-width: 100%;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ref:hover { border-color: var(--brass); color: var(--brass-2); }
.ref .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.ref.missing { border: 1px dashed var(--warn); color: var(--warn); cursor: default; }
.filters { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; align-items: center; font-size: 11px;
  letter-spacing: .14em; text-transform: uppercase; color: var(--rust-2); }
.filters select { font: 14px var(--sans); padding: 7px 10px; border-radius: 3px; border: 1px solid var(--line-strong);
  background: var(--forest-deep); color: var(--cream); letter-spacing: 0; text-transform: none; }
/* overview */
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px; }
.stat { background: var(--forest-2); border: 1px solid var(--line); border-radius: 2px; padding: 18px 20px;
  text-decoration: none; color: inherit; transition: border-color .2s, transform .2s; }
.stat:hover { border-color: var(--brass); transform: translateY(-2px); color: inherit; }
.stat .big { font: 2.6rem/1 var(--serif); color: var(--brass); }
.stat .lab { color: var(--cream-3); font-size: 14px; margin-top: 6px; }
.bar { display: flex; height: 6px; border-radius: 1px; overflow: hidden; background: var(--forest-deep); margin: 14px 0 8px; }
.bar span { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.legend i { display: inline-block; width: 7px; height: 7px; border-radius: 1px; margin-right: 5px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 0 36px; }
.rows { background: var(--forest-2); border: 1px solid var(--line); border-radius: 2px; overflow: hidden; }
.row { display: flex; gap: 14px; align-items: baseline; padding: 11px 16px; border-top: 1px solid var(--line); cursor: pointer; font-size: 15px; }
.row:first-child { border-top: 0; }
.row:hover { background: var(--forest-deep); }
.row .when { color: var(--muted); font-size: 11px; letter-spacing: .06em; white-space: nowrap; min-width: 84px; }
.row .grow { flex: 1; min-width: 0; }
.row.static { cursor: default; }
.row.static:hover { background: none; }
.warnbox { background: rgba(168,73,43,.14); border: 1px solid var(--rust); border-radius: 2px; padding: 12px 18px; font-size: 14px; }
.warnbox ul { margin: 0; padding-left: 18px; }
.warnbox li { margin: 4px 0; }
.warnbox code { font: 12px var(--mono); color: var(--brass-2); }
/* structure */
.beat { background: var(--forest-2); border: 1px solid var(--line); border-radius: 2px; padding: 20px 22px; margin-bottom: 16px; }
.beat.is-stale { border-left: 3px solid var(--stale); }
.beat-h { display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; cursor: pointer; }
.beat-h .ord { font: 2.6rem/1 var(--serif); color: var(--rust-2); min-width: 36px; }
.beat-h h3 { margin: 0; font-size: 1.5rem; }
.beat-h:hover h3 { color: var(--brass-2); }
.beat .reveals { margin: 8px 0 14px 50px; color: var(--cream-3); font-size: 15px; }
.beat .grid { margin-left: 50px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
.beat .card { background: var(--forest-deep); }
/* assets */
.prompt { font: 12.5px/1.5 var(--mono); background: var(--forest-deep); border: 1px solid var(--line); color: var(--cream-3);
  border-radius: 2px; padding: 10px 12px; white-space: pre-wrap; max-height: 160px; overflow: auto; margin: 0; cursor: text; }
.btn { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; padding: 7px 14px; border-radius: 3px;
  border: 1px solid var(--rust); background: transparent; color: var(--cream); cursor: pointer; transition: background .15s; }
.btn:hover { background: var(--rust); color: var(--on-rust); }
.made { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
.thumb { max-width: 100%; max-height: 150px; border-radius: 2px; object-fit: contain; align-self: flex-start; border: 1px solid var(--line); }
/* drawer */
#scrim { position: fixed; inset: 0; background: rgba(10,20,15,.55); z-index: 20; }
#drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(640px, 100vw); background: var(--forest-deep);
  border-left: 2px solid var(--rust); z-index: 21; overflow-y: auto; padding: 22px 30px 48px;
  box-shadow: -20px 0 50px -10px rgba(0,0,0,.5); }
#drawer h2 { font-size: clamp(1.7rem, 3vw, 2.3rem); margin: 10px 0 18px; }
#drawer .sec { margin: 28px 0 10px; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--rust-2); }
#drawer .rows, #drawer .ref { background: var(--forest-2); }
.close { float: right; }
.fields { display: grid; grid-template-columns: max-content 1fr; gap: 8px 18px; margin: 0; font-size: 15px; }
.fields dt { color: var(--muted); font: 11px/2 var(--mono); letter-spacing: .1em; text-transform: uppercase; }
.fields dd { margin: 0; min-width: 0; }
.spoiler { filter: blur(6px); cursor: pointer; transition: filter .15s; }
.spoiler.shown { filter: none; }
.md { font-size: 15.5px; line-height: 1.65; }
.md h3, .md h4, .md h5 { font-family: var(--serif); font-weight: 400; color: var(--brass); margin: 20px 0 6px; font-size: 1.2rem; }
.md p { margin: 8px 0; }
.md ul, .md ol { margin: 8px 0; padding-left: 22px; }
.md li::marker { color: var(--rust-2); }
.md code { font: 13px var(--mono); background: var(--forest-2); padding: 1px 5px; border-radius: 2px; }
.md pre { background: var(--forest-2); padding: 12px; border-radius: 2px; overflow-x: auto; }
.md blockquote { margin: 8px 0; padding-left: 14px; border-left: 2px solid var(--rust); color: var(--cream-3); font-style: italic; }
.path { font-size: 11.5px; color: var(--muted); margin-top: 24px; }
@media (max-width: 640px) {
  .beat .reveals, .beat .grid { margin-left: 0; }
  .cols { grid-template-columns: 1fr; }
  #drawer { padding: 18px 16px 40px; }
}
.readiness{padding:12px 16px;border:1px solid var(--line);margin:12px 0}.readiness summary{cursor:pointer}.readiness li{margin:9px 0}.flow-scroll{overflow:auto;max-width:100%;margin-top:20px}.flow-scroll svg{font-family:var(--sans,Arial,sans-serif)}.flow-scroll svg a:focus rect{stroke:#fff;stroke-width:3}.reset-table{border-collapse:collapse;min-width:760px;width:100%;font-size:13px}.reset-table th,.reset-table td{border:1px solid var(--line);padding:14px;text-align:left;vertical-align:top}.reset-table td{min-width:130px}.reset-table p{margin:0 0 8px}

<script>
// Shared by index.html (design board) and play.html (play-test).
"use strict";

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const asList = v => v == null || v === "" ? [] : Array.isArray(v) ? v : [v];

// ---------- tiny markdown ----------
// idFn(id) renders a record ID found in the text; omit it to leave IDs as plain text.
function inline(s, idFn) {
  const codes = [];
  s = esc(s).replace(/`([^`]+)`/g, (m, c) => { codes.push(c); return `\u0000${codes.length - 1}\u0000`; });
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*\w])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, t, u) => /^(https?:|#)/.test(u) ? `<a href="${u}" target="_blank" rel="noopener">${t}</a>` : `<a href="../${u}" target="_blank">${t}</a>`);
  if (idFn) s = s.replace(/(^|[^\w-])((?:PR|ST|PZ|PP|Q|AS)-\d{3,})\b/g, (m, pre, id) => pre + idFn(id));
  return s.replace(/\u0000(\d+)\u0000/g, (m, i) => `<code>${codes[i]}</code>`);
}
function md(src, idFn) {
  src = String(src || "").replace(/<!--[^]*?-->/g, "");
  let html = "", para = [], list = null, code = null;
  const flushP = () => { if (para.length) { html += `<p>${inline(para.join(" "), idFn)}</p>`; para = []; } };
  const flushL = () => { if (list) { html += `<${list.t}>${list.items.map(i => `<li>${inline(i, idFn)}</li>`).join("")}</${list.t}>`; list = null; } };
  for (const ln of String(src || "").replace(/\r/g, "").split("\n")) {
    if (code) { if (/^```/.test(ln)) { html += `<pre><code>${esc(code.join("\n"))}</code></pre>`; code = null; } else code.push(ln); continue; }
    let m;
    if (/^```/.test(ln)) { flushP(); flushL(); code = []; continue; }
    if ((m = ln.match(/^(#{1,4})\s+(.*)/))) { flushP(); flushL(); const n = Math.min(m[1].length + 2, 6); html += `<h${n}>${inline(m[2], idFn)}</h${n}>`; continue; }
    if ((m = ln.match(/^\s*([-*]|\d+\.)\s+(.*)/))) {
      flushP(); const t = /\d/.test(m[1]) ? "ol" : "ul";
      if (!list || list.t !== t) { flushL(); list = { t, items: [] }; }
      list.items.push(m[2]); continue;
    }
    if ((m = ln.match(/^>\s?(.*)/))) { flushP(); flushL(); html += `<blockquote>${inline(m[1], idFn)}</blockquote>`; continue; }
    if (!ln.trim()) { flushP(); flushL(); continue; }
    if (list && /^\s{2,}/.test(ln)) { list.items[list.items.length - 1] += " " + ln.trim(); continue; }
    flushL(); para.push(ln.trim());
  }
  if (code) html += `<pre><code>${esc(code.join("\n"))}</code></pre>`;
  flushP(); flushL();
  return html;
}

// Text of a "## Heading" section in a record body (up to the next ## heading), or "".
function mdSection(body, heading) {
  const lines = String(body || "").replace(/\r/g, "").split("\n");
  const want = heading.trim().toLowerCase();
  let out = null;
  for (const ln of lines) {
    const m = ln.match(/^##\s+(.*)/);
    if (m) { if (out) break; if (m[1].trim().toLowerCase() === want) out = []; continue; }
    if (out) out.push(ln);
  }
  return out ? out.join("\n").trim() : "";
}
// Items of a list section, e.g. the "## Hints" ladder. Empty items are dropped.
function mdListItems(section) {
  return section.split("\n").map(l => l.match(/^\s*(?:[-*]|\d+\.)\s*(.*)$/)).filter(m => m && m[1].trim()).map(m => m[1].trim());
}

// ---------- site bar + light/dark toggle ----------
// Shares the "ebp-theme" choice with escapepack.ca. No choice stored = follow the OS setting.
(() => {
  const KEY = "ebp-theme";
  const dark = () => matchMedia("(prefers-color-scheme: dark)").matches;
  const current = () => document.documentElement.dataset.theme || (dark() ? "dark" : "light");
  const bar = document.createElement("div");
  bar.className = "sitebar";
  bar.innerHTML = '<a class="brand" href="https://escapepack.ca"><i aria-hidden="true"></i><span>Escape<br>Backpack</span></a><button class="theme-toggle" type="button"></button>';
  const SUN = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  const MOON = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>';
  const btn = bar.querySelector("button");
  const label = () => { const d = current() === "dark"; btn.innerHTML = d ? SUN : MOON; btn.title = d ? "Switch to light mode" : "Switch to dark mode"; btn.setAttribute("aria-label", d ? "Switch to light mode" : "Switch to dark mode"); };
  btn.addEventListener("click", () => {
    const next = current() === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem(KEY, next); } catch (e) {}
    label();
  });
  label();
  document.body.prepend(bar);
})();

<script>
/* Hint-page sync: logs a team's run to a stats API (escapepack.ca's workers/stats), lets other
   phones join the same run with a game code, and draws the end-screen comparison.
   Works offline: actions queue in localStorage and are sent when the phone is back online.

     const sync = EBSync.create({ api, backpack, version, locks, key });
     sync.onState(state => ...)     // the run as the server has it, after each send or refresh
     sync.start({ team, session })  // a new run; sync.code is its game code once the server answers
     sync.join(code)                // follow a teammate's run -> state (throws if the code is unknown)
     sync.op({ t: "solve", lock: 2, upto: true })   // also hint / unsolve / pause / resume / finish
     sync.toLocal(serverMs)         // a server timestamp on this phone's clock
     sync.stats()                   // comparison numbers for this run, or null
     sync.leave()                   // stop following (Reset / Play again)

   A copy is served by escapepack.ca as /sync.js for its hand-made Hiking page
   (escapepack-site/tools/build_help.py copies it). */
(function () {
  "use strict";
  const read = k => { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } };
  const write = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

  function device() {
    const ua = navigator.userAgent;
    return {
      device: /Mobi|Android|iPhone|iPad/i.test(ua) ? "mobile" : "desktop",
      browser: /Edg/i.test(ua) ? "Edge" : /Chrome|CriOS/i.test(ua) ? "Chrome" : /Firefox|FxiOS/i.test(ua) ? "Firefox" : /Safari/i.test(ua) ? "Safari" : "Other",
    };
  }

  function create(cfg) {
    const KEY = cfg.key + ":sync";
    const blank = () => ({ code: "", session: "", offset: s ? s.offset : 0, queue: [], create: null });
    let s = null;
    s = Object.assign(blank(), read(KEY) || {});
    const save = () => write(KEY, s);
    const listeners = [];
    let busy = false, again = false, soon = 0;

    async function call(method, path, body) {
      const t0 = Date.now();
      const res = await fetch(cfg.api + path, {
        method, keepalive: method === "POST",
        headers: body ? { "Content-Type": "application/json" } : {},
        body: body ? JSON.stringify(body) : undefined,
      });
      const t1 = Date.now();
      const data = await res.json().catch(() => ({}));
      if (!res.ok) { const e = new Error(data.error || "HTTP " + res.status); e.status = res.status; throw e; }
      if (data.now) s.offset = Math.round(data.now - (t0 + t1) / 2);
      return data;
    }

    // Send the queue (or just refresh) and hand the server's state to the page.
    async function flush() {
      if (!cfg.api) return null;
      if (busy) { again = true; return null; }
      busy = true;
      try {
        if (s.create) {
          const st = await call("POST", "/runs", Object.assign({}, s.create, { age_ms: Date.now() - s.create.at }));
          s.code = st.code; s.create = null; save();
        }
        if (!s.code) return null;
        const sent = s.queue.slice();
        const ops = sent.map(o => { const c = Object.assign({}, o, { ago: Date.now() - o.ts }); delete c.ts; return c; });
        const st = ops.length ? await call("POST", "/runs/" + s.code + "/ops", { ops }) : await call("GET", "/runs/" + s.code);
        s.queue.splice(0, sent.length); save();
        // Actions made while this request was out would be undone by an older state: wait for the next one.
        if (!s.queue.length) listeners.forEach(f => f(st));
        return st;
      } catch (e) {
        if (e.status === 404 && s.code && !s.create) { s.code = ""; s.queue = []; save(); } // the run is gone
        else if (s.create && e.status && e.status < 500) { s.create = null; save(); } // refused: stop retrying
        return null;
      } finally {
        busy = false;
        if (again) { again = false; schedule(); }
      }
    }
    function schedule(ms) { clearTimeout(soon); soon = setTimeout(flush, ms || 250); }

    const live = () => !!(s.code || s.create);
    setInterval(() => { if (live() && document.visibilityState === "visible") flush(); }, 15000);
    document.addEventListener("visibilitychange", () => { if (live() && document.visibilityState === "visible") flush(); });
    window.addEventListener("online", () => { if (live()) flush(); });
    if (live()) schedule(500);

    return {
      get code() { return s.code; },
      get pending() { return !!s.create; },
      onState(f) { listeners.push(f); },
      start(info) {
        if (!cfg.api) return Promise.resolve(null);
        s = blank();
        s.session = info.session;
        s.create = Object.assign({ backpack: cfg.backpack, version: cfg.version, locks_total: cfg.locks,
          team: info.team || "", team_size: info.team_size || undefined, session_id: info.session, at: Date.now() }, device());
        save();
        return flush();
      },
      async join(code) {
        const st = await call("GET", "/runs/" + String(code).trim().toUpperCase().replace(/[^A-Z0-9]/g, ""));
        if (st.backpack !== cfg.backpack) { const e = new Error("That code is for a different game."); e.status = 404; throw e; }
        s = blank(); s.code = st.code; s.session = st.session_id; save();
        return st;
      },
      op(o) {
        if (!live()) return;
        s.queue.push(Object.assign({}, o, { ts: Date.now() }));
        save(); schedule();
      },
      flush,
      toLocal: ms => (ms == null ? 0 : ms - s.offset),
      async stats() {
        if (!cfg.api) return null;
        try {
          return await call("GET", "/stats?backpack=" + encodeURIComponent(cfg.backpack) + "&version=" + encodeURIComponent(cfg.version)
            + (s.session ? "&session=" + encodeURIComponent(s.session) : ""));
        } catch (e) { return null; }
      },
      leave() { s = blank(); save(); },
    };
  }

  // ---- end-screen comparison (inline styles use the page's own colour variables) ----
  const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const mins = s => { const m = Math.round(s / 60); return m >= 60 ? Math.floor(m / 60) + " h " + String(m % 60).padStart(2, "0") : m + " min"; };
  const WHY = {
    test: "Test runs aren't compared with other teams.",
    unfinished: "Not every lock was marked as solved, so this run isn't compared with other teams.",
    continued: "This run picked up a game already under way, so its time isn't compared with other teams.",
    short: "Runs under 30 minutes aren't compared with other teams.",
    long: "Runs over 4 hours aren't compared with other teams.",
  };

  function strip(totals, mine) {
    const all = totals.concat(mine != null ? [mine] : []);
    const lo = Math.min(...all), hi = Math.max(...all), w = 300, pad = 10;
    const x = t => hi === lo ? w / 2 : pad + (t - lo) / (hi - lo) * (w - 2 * pad);
    const dots = totals.map(t => `<circle cx="${x(t).toFixed(1)}" cy="22" r="4" fill="currentColor" opacity=".45"/>`).join("");
    const me = mine != null ? `<circle cx="${x(mine).toFixed(1)}" cy="22" r="7" fill="var(--brass, #d6ad6b)"/>
      <text x="${x(mine).toFixed(1)}" y="9" text-anchor="middle" font-size="10" fill="var(--brass, #d6ad6b)">YOU</text>` : "";
    return `<svg viewBox="0 0 ${w} 44" width="100%" style="max-width:${w}px;display:block;margin:10px auto 2px;color:var(--muted, #9db0a2)"
      role="img" aria-label="Your time among other teams' times"><line x1="${pad}" y1="22" x2="${w - pad}" y2="22" stroke="currentColor" opacity=".35"/>${dots}${me}
      <text x="${pad}" y="42" font-size="10" fill="currentColor">${esc(mins(lo))}</text><text x="${w - pad}" y="42" text-anchor="end" font-size="10" fill="currentColor">${esc(mins(hi))}</text></svg>`;
  }

  // stats: from sync.stats(). names: lock names, for the best-lock line.
  function compareHTML(stats, names) {
    if (!stats) return `<p style="opacity:.75">Comparison with other teams needs a connection. It will show here once you're back online.</p>`;
    const you = stats.you || {}, min = stats.rules.minRuns;
    let h = "";
    if (you.reason && WHY[you.reason]) h += `<p style="opacity:.8">${WHY[you.reason]}</p>`;
    if (stats.count < min) {
      h += `<p>${stats.count ? `${stats.count} team${stats.count === 1 ? " has" : "s have"} finished so far.` : "You're one of the first teams to play!"}
        Comparisons appear once ${min} teams have finished.</p>`;
      return h;
    }
    if (you.faster_than != null) h += `<p style="font-size:1.15em"><strong>Faster than ${you.faster_than}% of teams</strong></p>`;
    h += strip(stats.totals, you.counts ? you.total : null);
    h += `<p style="opacity:.8">${stats.count} teams · typical time ${esc(mins(stats.median))} · fastest ${esc(mins(stats.fastest))}</p>`;
    const best = (you.locks || []).map((p, i) => [p, i]).filter(([p]) => p != null).sort((a, b) => b[0] - a[0])[0];
    if (best && best[0] >= 50) h += `<p>Your best lock: <strong>${esc(names[best[1]] || "Lock " + (best[1] + 1))}</strong>, faster than ${best[0]}% of teams.</p>`;
    return h;
  }

  window.EBSync = { create, compareHTML };
})();
</script>

", "hints": ["The chart is not empty. Something is drawn where the card is pointing.", "Are you certain which animal that is? Look at its pose and silhouette, not only its location.", "It is a bear. Read B, E, A, R off the index on the back of the museum ticket."], "answer": "3212", "solution": "The postcard points to square F1 on the sea chart, where the bear is drawn. Reading B, E, A, R off the museum ticket’s visitor index gives **3212**."}, {"id": "PZ-010", "title": "Lock 8", "lock": "4-letter", "status": "decided", "hints": ["Your museum ticket has a coin room. Sort the coins into its three groups.", "The treasure hunt ended at a cave. Look at the mark beside it on Aud’s map, then find the same mark on the ticket: only those coins count.", "Add up what those coins are worth on the ticket and set the total on the treasure tally.", "Turn the whole tally upside down and read the four characters from left to right."], "answer": "SOLE", "solution": "The marked group adds up to **3705**, which reads **SOLE** upside down."}, {"id": "PZ-007", "title": "Lock 9", "lock": "4-digit", "status": "decided", "hints": ["Read the Rouen postcard next to the back of the Rouen museum ticket. Some of Liv’s words have a partner on the ticket.", "The ticket pairs everyday Saxon words (numbered) with their Norman partners (lettered). A matched pair gives a letter and a number: a square on the Granted Lands map.", "Liv mentions fighting, people, poultry and an inn, in that order. For each word, find its square on the map and count the squares to the little drawing for that word."], "answer": "1486", "solution": "Fight: **1** square. People (folk): **4**. Poultry (hen): **8**. Inn: **6**. In the postcard’s order the code is **1486**."}, {"id": "PZ-011", "title": "Lock 10", "lock": "3-digit", "status": "decided", "hints": ["The Bayeux, Winchester and Battle postcards each end with a little picture puzzle. Read them as words.", "Two of the picture puzzles point to places on the Granted Lands map; the third tells you which scale of the ruler to use.", "Measure between those two places on the Granted Lands map, dot to dot, with the architect’s ruler on its 1:125 scale."], "answer": "104", "solution": "Bayeux: cross + bow + lightning bolt = CROSSBOW BOLT, so Châlus. Winchester: tree + tea = TREATY, so Saint-Clair-sur-Epte. Battle: SCALE 1:125. Châlus to Saint-Clair-sur-Epte measures 10.4 on the 1:125 scale: **104**."}, {"id": "PZ-008", "title": "Lock 11", "lock": "3-digit", "status": "decided", "hints": ["The board is eleven columns wide. Count what you can actually see.", "Something was lying on the ink. It is still in the bag, and it is the right shape.", "Work backward from a corner that is still reachable.", "F6 → H6 → H11 → K11 — then measure each leg."], "answer": "253", "solution": "Set out the starting position from Liv’s note, with columns I to K taken from the museum ticket. The king starts on the centre square F6 and escapes in exactly three moves: F6 → H6 → H11 → K11. The moves are **2**, **5** and **3** squares long: **253**."}, {"id": "PZ-012", "title": "Lock 12", "lock": "4-digit", "status": "decided", "hints": ["The underlined word on the Sicily postcard matters to the map’s unusual column labels.", "Read the columns R, A, V, E, N in that order. On Hedeby’s key, each stem’s left branches select the row; its right branches select the letter.", "Use the five decoded letters as perches on the raven’s flights card. Move directly from each letter to the next and read one digit from each flight. Do not add them."], "answer": "2648", "solution": "R6 → H, A10 → R, V9 → A, E3 → F, N2 → N: HRAFN. Then H → R = 2, R → A = 6, A → F = 4, F → N = 8: **2648**."}, {"id": "PZ-013", "title": "Lock 13", "lock": "4-digit", "status": "decided", "hints": ["The stamps are not decoration — they say which journey a card belongs to.", "Four of these cards do not belong to any journey. Something in the last bundle says which.", "Work one map at a time, with that tr <script>
"use strict";
const H = window.HINTS;
const $ = s => document.querySelector(s);
const LOCKS = H.locks;
const KEY = "bp-hints:v2:" + H.name;
// Logging, game codes and the comparison only run when backpack.json has a "stats" entry.
const CFG = H.stats || null;
const SYNC = CFG && window.EBSync ? EBSync.create({ api: CFG.api, backpack: CFG.backpack, version: CFG.version, locks: LOCKS.length, key: KEY }) : null;

const fresh = () => ({ team: "", session: "", started: 0, paused: 0, pausedAt: 0, shown: {}, solved: {}, finished: 0 });
let S = fresh();
try { S = Object.assign(S, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

const elapsed = () => {
  if (!S.started) return 0;
  const end = S.finished || S.pausedAt || Date.now();
  return Math.max(0, end - S.started - S.paused);
};
const fmt = ms => { const t = Math.floor(ms / 1000); return [t / 3600, t / 60 % 60, t % 60].map(n => String(Math.floor(n)).padStart(2, "0")).join(":"); };
const lockName = l => l.lock ? `${l.lock} lock` : "Lock";
const heading = (l, i) => /^lock \d+$/i.test(l.title) ? l.title : `${i + 1}. ${l.title || lockName(l)}`;

function render() {
  $("#bar").hidden = !S.started;
  if (!S.started) {
    $("#view").innerHTML = `<div class="start"><h2 style="margin-top:0">Ready to start?</h2>
      <label class="kv" for="team">Team name</label><input id="team" autocomplete="off" placeholder="Your team">
      <button class="btn big" id="go">Start the timer</button>
      ${SYNC ? `<div class="join"><label class="kv" for="joincode">Joining a teammate's game? Enter the code on their screen</label>
        <div class="joinrow"><input id="joincode" autocomplete="off" maxlength="6" placeholder="CODE" autocapitalize="characters" spellcheck="false">
        <button class="btn" id="joinbtn">Join</button></div><div class="note" id="joinmsg"></div></div>` : ""}</div>`;
    return;
  }
  $("#teamlbl").textContent = S.team || "";
  $("#pause").textContent = S.pausedAt ? "Resume" : "Pause";
  let h = "";
  if (SYNC) h += SYNC.code
    ? `<div class="gamecode">Game code <b>${esc(SYNC.code)}</b>: teammates can join on their phone and share this timer and hints.</div>`
    : `<div class="gamecode">${SYNC.pending ? "Connecting…" : "Offline"}: the game code appears once this phone is online. Your progress is kept.</div>`;
  h += `<p class="note">Stuck? Open one hint at a time for the lock you're working on. The last step shows the solution.${SYNC ? " Tap “Mark solved” when a lock opens." : ""}</p>`;
  if (!LOCKS.length) h += `<div class="empty">No locks are ready yet.</div>`;
  LOCKS.forEach((l, i) => {
    const n = S.shown[l.id] || 0, total = l.hints.length + 1, solved = !!S.solved[l.id];
    const levels = l.hints.slice(0, n).map((t, k) => `<div class="level"><b>Hint ${k + 1}</b>${inline(t)}</div>`).join("")
      + (n >= total ? `<div class="level sol"><b>Solution</b>${l.answer ? `<div class="code">${esc(l.answer)}</div>` : ""}${l.solution ? `<div class="md">${md(l.solution)}</div>` : ""}${!l.answer && !l.solution ? "<i>Not written yet.</i>" : ""}</div>` : "");
    const next = n < l.hints.length ? `Hint ${n + 1}` : n < total ? "Show the solution" : "";
    const buttons = (next ? `<button class="btn" data-next="${i}">${next}</button>` : "")
      + (SYNC ? `<button class="btn${solved ? " on" : ""}" data-solve="${i}">${solved ? "✓ Solved" : "Mark solved"}</button>` : "");
    h += `<section class="lockcard${solved ? " solved" : ""}"><h3>${esc(heading(l, i))}${l.status === "candidate" ? '<span class="cand">candidate</span>' : ""}</h3>
      ${l.title ? `<div class="kv">${esc(lockName(l))}</div>` : ""}<div class="levels">${levels}</div>
      ${buttons ? `<div class="btnrow">${buttons}</div>` : ""}</section>`;
  });
  $("#view").innerHTML = h;
}
function tick() { $("#clock").textContent = fmt(elapsed()); }

// The run as the server has it (this phone's actions included, plus any teammate's).
function fromServer(st) {
  const next = Object.assign(fresh(), { team: st.team || S.team, session: st.session_id,
    started: SYNC.toLocal(st.started_ms), paused: st.paused_total_ms,
    pausedAt: st.paused_since_ms != null ? SYNC.toLocal(st.paused_since_ms) : 0,
    finished: st.finished_ms != null ? SYNC.toLocal(st.finished_ms) : 0 });
  LOCKS.forEach((l, i) => {
    const lv = st.hints[i] || [];
    if (lv.length) next.shown[l.id] = Math.max(...lv) + 1;
    if (st.lock_times[i] != null) next.solved[l.id] = true;
  });
  const shape = x => JSON.stringify([x.team, x.shown, x.solved, !!x.pausedAt, !!x.finished]);
  const changed = shape(next) !== shape(S) || !S.started, ended = next.finished && !S.finished;
  S = next; save();
  if (changed) render();
  tick();
  if (ended) showDone();
}
if (SYNC) SYNC.onState(fromServer);

function showDone() {
  const used = Object.values(S.shown).reduce((a, b) => a + b, 0);
  $("#done").innerHTML = `<div class="inner"><div class="eyebrow">Adventure complete</div><h2>Congratulations${S.team ? ", " + esc(S.team) : ""}!</h2>
    <div class="clock">${fmt(elapsed())}</div><p class="note">${used} hint${used === 1 ? "" : "s"} opened. Thank you for playing ${esc(H.name)}!</p>
    ${SYNC ? `<div id="cmp"><p style="opacity:.7">Comparing with other teams…</p></div>` : ""}
    <button class="btn big" id="again">Play again</button></div>`;
  $("#done").hidden = false; tick();
  // The server's time is the one every teammate's phone shows.
  if (SYNC) SYNC.flush().then(st => {
    const clock = $("#done .clock");
    if (st && st.finished_ms != null && clock) clock.textContent = fmt(st.elapsed_s * 1000);
    return SYNC.stats();
  }).then(stats => {
    const box = $("#cmp");
    if (box) box.innerHTML = EBSync.compareHTML(stats, LOCKS.map(heading));
  });
}

document.addEventListener("click", async e => {
  if (e.target.id === "go") {
    S = Object.assign(fresh(), { team: $("#team").value.trim(), started: Date.now(),
      session: "s" + Date.now() + "_" + Math.random().toString(36).slice(2, 5) });
    save();
    if (SYNC) SYNC.start({ team: S.team, session: S.session }).then(() => render());
    render(); tick(); return;
  }
  if (e.target.id === "joinbtn") {
    const msg = $("#joinmsg");
    msg.textContent = "Joining…";
    try { fromServer(await SYNC.join($("#joincode").value)); }
    catch (err) { msg.textContent = err.status === 404 ? "No game with that code. Check the code on your teammate's screen." : "Couldn't connect. Check your connection and try again."; }
    return;
  }
  const nx = e.target.closest("[data-next]");
  if (nx) {
    const i = +nx.dataset.next, l = LOCKS[i], n = S.shown[l.id] || 0;
    if (n >= l.hints.length && !confirm("Show the solution for this lock?")) return;
    S.shown[l.id] = n + 1; save(); render();
    if (SYNC) SYNC.op({ t: "hint", lock: i, level: n });
    return;
  }
  const sv = e.target.closest("[data-solve]");
  if (sv) {
    const i = +sv.dataset.solve, linear = !!(CFG && CFG.linear);
    if (!S.solved[LOCKS[i].id]) {
      // Locks open in order: marking one also marks any earlier lock the team forgot to mark.
      LOCKS.forEach((l, j) => { if (j === i || (linear && j < i)) S.solved[l.id] = true; });
      SYNC.op({ t: "solve", lock: i, upto: linear });
    } else {
      LOCKS.forEach((l, j) => { if (j === i || (linear && j > i)) delete S.solved[l.id]; });
      SYNC.op({ t: "unsolve", lock: i, after: linear });
    }
    save(); render(); return;
  }
  if (e.target.id === "again") {
    S = fresh(); save(); if (SYNC) SYNC.leave();
    $("#done").hidden = true; render();
  }
});
$("#pause").addEventListener("click", () => {
  if (S.pausedAt) { S.paused += Date.now() - S.pausedAt; S.pausedAt = 0; if (SYNC) SYNC.op({ t: "resume" }); }
  else { S.pausedAt = Date.now(); if (SYNC) SYNC.op({ t: "pause" }); }
  save(); render(); tick();
});
$("#finish").addEventListener("click", () => {
  if (!S.finished && !confirm("Did you open the last lock? This stops the timer.")) return;
  if (!S.finished) {
    if (S.pausedAt) { S.paused += Date.now() - S.pausedAt; S.pausedAt = 0; }
    S.finished = Date.now(); save();
    if (SYNC) SYNC.op({ t: "finish" });
  }
  showDone();
});

$("#proj").textContent = H.name;
document.title = H.name + " · Hint companion";
render(); tick(); setInterval(tick, 1000);
if (S.finished) showDone();
</script>
</body>
</html>
