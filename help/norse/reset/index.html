<title>Reset checklist</title>
<!-- Player-facing reset checklist from backpack-kit (backpack.json: "publish_reset": true).
     kit.py build inlines the style, helpers and data. One step per lock, last lock first, from the
     puzzles' container / answer / reset_display and the props' found_in / after_game / ## Reset. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Inter+Tight:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Look follows escapepack.ca: light paper with forest headings and rust accents, plus a
   forest-green dark mode. Toggle and theme storage live in common.js (key "ebp-theme"). */
:root {
  /* Light is the default and matches escapepack.ca (paper, forest ink, rust accents).
     Names keep their old dark-theme meaning: --forest is the page, --cream the text. */
  --forest: #f3eadb; --forest-2: #fbf7ee; --forest-deep: #e9ddca;
  --cream: #20392e; --cream-3: #3d5648; --muted: #65776b;
  --brass: #17372d; --brass-2: #b95b3d; --rust: #b95b3d; --rust-2: #a04a2f; --on-rust: #fff;
  --line: rgba(32, 57, 46, 0.17); --line-strong: rgba(32, 57, 46, 0.34);
  --s-idea: #8a7f6d; --s-candidate: #a87424; --s-decided: #2f7590; --s-built: #4a7f38;
  --s-parked: #b95b3d; --s-open: #a87424; --s-answered: #4a7f38; --s-superseded: #9a917f;
  --warn: #b95b3d; --stale: #a87424;
  --nav-bg: rgba(247, 241, 230, .94); --glow-1: rgba(214,173,107,.10); --glow-2: rgba(185,91,61,.05);
  --flow-a: #e3efe6; --flow-b: #fbf7ee; --flow-stroke: #5f8a70; --flow-block: #b95b3d;
  --flow-id: #8a5f1c; --flow-title: #20392e; --flow-status: #3d5648; --flow-needs: #a87424; --flow-use: #4f7d63;
  --serif: "Young Serif", "Cormorant Garamond", Georgia, serif;
  --sans: "Inter Tight", "Inter", -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  color-scheme: light;
}
/* Dark: forest-green page. Applies when the visitor picked it, or the OS prefers it and they haven't picked light. */
:root[data-theme="dark"] {
  --forest: #17372d; --forest-2: #214b3d; --forest-deep: #10291f;
  --cream: #f7f1e6; --cream-3: #d8ccb4; --muted: #9db0a2;
  --brass: #d6ad6b; --brass-2: #e8c28a; --rust: #b95b3d; --rust-2: #e0805e;
  --line: rgba(244, 237, 224, 0.14); --line-strong: rgba(244, 237, 224, 0.28);
  --s-idea: #a39884; --s-candidate: #d4a668; --s-decided: #8fc1d4; --s-built: #9cc98a;
  --s-parked: #e0805e; --s-open: #d4a668; --s-answered: #9cc98a; --s-superseded: #8b8270;
  --warn: #e0805e; --stale: #e8c28a;
  --nav-bg: rgba(16, 41, 31, .94); --glow-1: rgba(212,166,104,.06); --glow-2: rgba(168,73,43,.05);
  --flow-a: #234b3e; --flow-b: #142e24; --flow-stroke: #77947c; --flow-block: #e8a674;
  --flow-id: #d9b47a; --flow-title: #f6f0e3; --flow-status: #cbd7bd; --flow-needs: #d9b47a; --flow-use: #91b9a3;
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --forest: #17372d; --forest-2: #214b3d; --forest-deep: #10291f;
    --cream: #f7f1e6; --cream-3: #d8ccb4; --muted: #9db0a2;
    --brass: #d6ad6b; --brass-2: #e8c28a; --rust: #b95b3d; --rust-2: #e0805e;
    --line: rgba(244, 237, 224, 0.14); --line-strong: rgba(244, 237, 224, 0.28);
    --s-idea: #a39884; --s-candidate: #d4a668; --s-decided: #8fc1d4; --s-built: #9cc98a;
    --s-parked: #e0805e; --s-open: #d4a668; --s-answered: #9cc98a; --s-superseded: #8b8270;
    --warn: #e0805e; --stale: #e8c28a;
    --nav-bg: rgba(16, 41, 31, .94); --glow-1: rgba(212,166,104,.06); --glow-2: rgba(168,73,43,.05);
    --flow-a: #234b3e; --flow-b: #142e24; --flow-stroke: #77947c; --flow-block: #e8a674;
    --flow-id: #d9b47a; --flow-title: #f6f0e3; --flow-status: #cbd7bd; --flow-needs: #d9b47a; --flow-use: #91b9a3;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--forest); color: var(--cream); }
body { font: 16px/1.55 var(--sans); -webkit-font-smoothing: antialiased; min-height: 100vh;
  background-image: radial-gradient(circle at 20% 20%, var(--glow-1) 0%, transparent 55%),
    radial-gradient(circle at 85% 75%, var(--glow-2) 0%, transparent 50%); background-attachment: fixed; }
a { color: var(--brass); }
a:hover { color: var(--rust-2); }
h1, h2, h3 { font-family: var(--serif); font-weight: 400; color: var(--brass); letter-spacing: -0.01em; line-height: 1.15; }
.eyebrow, .rid, .pill, .flag, .kv, .meta, .legend, .row .when, .sec, .path, .filters, nav a, .made, .btn { font-family: var(--mono); }
.eyebrow { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--rust-2); }
header { display: flex; gap: 16px; align-items: flex-end; justify-content: space-between; flex-wrap: wrap;
  padding: 22px clamp(16px, 4vw, 40px) 16px; max-width: 1260px; margin: 0 auto; }
header h1 { margin: 4px 0 2px; font-size: clamp(1.8rem, 4vw, 2.6rem); }
header .sub { color: var(--muted); font: 12px var(--mono); letter-spacing: .06em; }
#q { width: min(320px, 100%); padding: 10px 14px; border: 1px solid var(--line-strong); border-radius: 3px;
  background: var(--forest-deep); color: var(--cream); font: 15px var(--sans); outline: none; }
#q:focus { border-color: var(--brass); }
#q::placeholder { color: var(--muted); }
nav { display: flex; flex-wrap: wrap; gap: 0 clamp(14px, 2.4vw, 28px);
  padding: 0 max(clamp(16px, 4vw, 40px), calc((100% - 1260px) / 2 + clamp(16px, 4vw, 40px)));
  position: sticky; top: 0; z-index: 5; background: var(--nav-bg); backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px); border-bottom: 2px solid var(--rust); }
nav a { padding: 14px 2px 12px; color: var(--brass); text-decoration: none; white-space: nowrap; position: relative;
  font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
nav a:hover { color: var(--cream); }
nav a.on { color: var(--cream); }
nav a.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: -2px; height: 2px; background: var(--brass); }
nav .n { color: var(--muted); margin-left: 6px; }
main { padding: 24px clamp(16px, 4vw, 40px) 80px; max-width: 1260px; margin: 0 auto; }
h2 { font-size: clamp(1.4rem, 2.6vw, 1.9rem); margin: 38px 0 14px; }
main > h2:first-child { margin-top: 8px; }
h2 .n { color: var(--muted); font: 12px var(--mono); letter-spacing: .08em; margin-left: 6px; vertical-align: middle; }
.empty { color: var(--muted); font-style: italic; padding: 6px 0; }
.note { color: var(--muted); font-size: 14px; margin: 4px 0 16px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.card { background: var(--forest-2); border: 1px solid var(--line); border-radius: 2px; padding: 18px 20px;
  cursor: pointer; display: flex; flex-direction: column; gap: 8px; min-width: 0;
  transition: transform .2s ease, border-color .2s; }
.card:hover { border-color: var(--brass); transform: translateY(-2px); }
.card h3 { margin: 0; font-size: 1.3rem; }
.card.is-stale { border-left: 3px solid var(--stale); }
.top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.rid { font-size: 11px; letter-spacing: .08em; color: var(--muted); }
.pill { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; padding: 2px 8px; border-radius: 2px;
  border: 1px solid currentColor; background: transparent; }
.flag { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; padding: 2px 8px; border-radius: 2px;
  border: 1px dashed var(--stale); color: var(--stale); }
.flag.dirty { border-color: var(--line-strong); color: var(--cream-3); }
.kv { font-size: 11.5px; letter-spacing: .06em; color: var(--muted); text-transform: uppercase; }
.kv b { color: var(--cream); font: 14px var(--sans); text-transform: none; letter-spacing: 0; }
.meta { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-top: auto;
  padding-top: 10px; border-top: 1px solid var(--line); }
.refs { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.refs .lbl { color: var(--muted); font: 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; margin-right: 2px; }
.ref { display: inline-flex; gap: 6px; align-items: center; padding: 2px 8px; border-radius: 2px;
  font: inherit; font-size: 13px; background: var(--forest-deep); border: 1px solid var(--line-strong); color: var(--cream); cursor: pointer; max-width: 100%;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ref:hover { border-color: var(--brass); color: var(--brass-2); }
.ref .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.ref.missing { border: 1px dashed var(--warn); color: var(--warn); cursor: default; }
.filters { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; align-items: center; font-size: 11px;
  letter-spacing: .14em; text-transform: uppercase; color: var(--rust-2); }
.filters select { font: 14px var(--sans); padding: 7px 10px; border-radius: 3px; border: 1px solid var(--line-strong);
  background: var(--forest-deep); color: var(--cream); letter-spacing: 0; text-transform: none; }
/* overview */
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px; }
.stat { background: var(--forest-2); border: 1px solid var(--line); border-radius: 2px; padding: 18px 20px;
  text-decoration: none; color: inherit; transition: border-color .2s, transform .2s; }
.stat:hover { border-color: var(--brass); transform: translateY(-2px); color: inherit; }
.stat .big { font: 2.6rem/1 var(--serif); color: var(--brass); }
.stat .lab { color: var(--cream-3); font-size: 14px; margin-top: 6px; }
.bar { display: flex; height: 6px; border-radius: 1px; overflow: hidden; background: var(--forest-deep); margin: 14px 0 8px; }
.bar span { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.legend i { display: inline-block; width: 7px; height: 7px; border-radius: 1px; margin-right: 5px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 0 36px; }
.rows { background: var(--forest-2); border: 1px solid var(--line); border-radius: 2px; overflow: hidden; }
.row { display: flex; gap: 14px; align-items: baseline; padding: 11px 16px; border-top: 1px solid var(--line); cursor: pointer; font-size: 15px; }
.row:first-child { border-top: 0; }
.row:hover { background: var(--forest-deep); }
.row .when { color: var(--muted); font-size: 11px; letter-spacing: .06em; white-space: nowrap; min-width: 84px; }
.row .grow { flex: 1; min-width: 0; }
.row.static { cursor: default; }
.row.static:hover { background: none; }
.warnbox { background: rgba(168,73,43,.14); border: 1px solid var(--rust); border-radius: 2px; padding: 12px 18px; font-size: 14px; }
.warnbox ul { margin: 0; padding-left: 18px; }
.warnbox li { margin: 4px 0; }
.warnbox code { font: 12px var(--mono); color: var(--brass-2); }
/* structure */
.beat { background: var(--forest-2); border: 1px solid var(--line); border-radius: 2px; padding: 20px 22px; margin-bottom: 16px; }
.beat.is-stale { border-left: 3px solid var(--stale); }
.beat-h { display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; cursor: pointer; }
.beat-h .ord { font: 2.6rem/1 var(--serif); color: var(--rust-2); min-width: 36px; }
.beat-h h3 { margin: 0; font-size: 1.5rem; }
.beat-h:hover h3 { color: var(--brass-2); }
.beat .reveals { margin: 8px 0 14px 50px; color: var(--cream-3); font-size: 15px; }
.beat .grid { margin-left: 50px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
.beat .card { background: var(--forest-deep); }
/* assets */
.prompt { font: 12.5px/1.5 var(--mono); background: var(--forest-deep); border: 1px solid var(--line); color: var(--cream-3);
  border-radius: 2px; padding: 10px 12px; white-space: pre-wrap; max-height: 160px; overflow: auto; margin: 0; cursor: text; }
.btn { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; padding: 7px 14px; border-radius: 3px;
  border: 1px solid var(--rust); background: transparent; color: var(--cream); cursor: pointer; transition: background .15s; }
.btn:hover { background: var(--rust); color: var(--on-rust); }
.made { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
.thumb { max-width: 100%; max-height: 150px; border-radius: 2px; object-fit: contain; align-self: flex-start; border: 1px solid var(--line); }
/* drawer */
#scrim { position: fixed; inset: 0; background: rgba(10,20,15,.55); z-index: 20; }
#drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(640px, 100vw); background: var(--forest-deep);
  border-left: 2px solid var(--rust); z-index: 21; overflow-y: auto; padding: 22px 30px 48px;
  box-shadow: -20px 0 50px -10px rgba(0,0,0,.5); }
#drawer h2 { font-size: clamp(1.7rem, 3vw, 2.3rem); margin: 10px 0 18px; }
#drawer .sec { margin: 28px 0 10px; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--rust-2); }
#drawer .rows, #drawer .ref { background: var(--forest-2); }
.close { float: right; }
.fields { display: grid; grid-template-columns: max-content 1fr; gap: 8px 18px; margin: 0; font-size: 15px; }
.fields dt { color: var(--muted); font: 11px/2 var(--mono); letter-spacing: .1em; text-transform: uppercase; }
.fields dd { margin: 0; min-width: 0; }
.spoiler { filter: blur(6px); cursor: pointer; transition: filter .15s; }
.spoiler.shown { filter: none; }
.md { font-size: 15.5px; line-height: 1.65; }
.md h3, .md h4, .md h5 { font-family: var(--serif); font-weight: 400; color: var(--brass); margin: 20px 0 6px; font-size: 1.2rem; }
.md p { margin: 8px 0; }
.md ul, .md ol { margin: 8px 0; padding-left: 22px; }
.md li::marker { color: var(--rust-2); }
.md code { font: 13px var(--mono); background: var(--forest-2); padding: 1px 5px; border-radius: 2px; }
.md pre { background: var(--forest-2); padding: 12px; border-radius: 2px; overflow-x: auto; }
.md blockquote { margin: 8px 0; padding-left: 14px; border-left: 2px solid var(--rust); color: var(--cream-3); font-style: italic; }
.path { font-size: 11.5px; color: var(--muted); margin-top: 24px; }
@media (max-width: 640px) {
  .beat .reveals, .beat .grid { margin-left: 0; }
  .cols { grid-template-columns: 1fr; }
  #drawer { padding: 18px 16px 40px; }
}
.readiness{padding:12px 16px;border:1px solid var(--line);margin:12px 0}.readiness summary{cursor:pointer}.readiness li{margin:9px 0}.flow-scroll{overflow:auto;max-width:100%;margin-top:20px}.flow-scroll svg{font-family:var(--sans,Arial,sans-serif)}.flow-scroll svg a:focus rect{stroke:#fff;stroke-width:3}.reset-table{border-collapse:collapse;min-width:760px;width:100%;font-size:13px}.reset-table th,.reset-table td{border:1px solid var(--line);padding:14px;text-align:left;vertical-align:top}.reset-table td{min-width:130px}.reset-table p{margin:0 0 8px}

  background: var(--forest-2); border-bottom: 1px solid var(--line); }
@media (max-width: 900px) {
  nav { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  nav::-webkit-scrollbar { display: none; }

<style>
main { max-width: 760px; }
.progress { position: sticky; top: 0; z-index: 5; background: var(--nav-bg); backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px); border-bottom: 2px solid var(--rust); }
.progress .in { max-width: 760px; margin: 0 auto; padding: 10px clamp(16px, 4vw, 40px); display: flex; gap: 12px; align-items: center; }
.progress .count { font: 1.1rem var(--mono); color: var(--brass); white-space: nowrap; }
.progress .track { flex: 1; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.progress .bar { height: 100%; width: 0; background: var(--brass); transition: width .3s; }
.intro { margin: 6px 0 18px; }
.step { background: var(--forest-2); border: 1px solid var(--line); border-radius: 2px; padding: 18px 20px; margin-bottom: 14px; }
.step.done { opacity: .55; border-color: var(--brass); }
.step h3 { margin: 0 0 2px; font-size: 1.3rem; }
.step .where { color: var(--cream-3); font: 13px var(--mono); letter-spacing: .04em; margin-bottom: 10px; }
.step ul { margin: 6px 0 10px 20px; padding: 0; }
.step li { margin: 2px 0; }
.step .keep { color: var(--brass-2); }
.step .lockline { border-left: 2px solid var(--brass); padding: 4px 0 4px 12px; margin: 10px 0 0; }
.code { font-family: var(--mono); letter-spacing: .02em; color: var(--brass-2); white-space: nowrap; }
.tick { display: flex; align-items: center; gap: 10px; margin-top: 14px; cursor: pointer; font: 12px var(--mono);
  letter-spacing: .1em; text-transform: uppercase; color: var(--cream-3); }
.tick input { width: 20px; height: 20px; accent-color: var(--brass); }
.finished { border: 1px solid var(--brass); padding: 20px; text-align: center; margin: 18px 0; }
.finished[hidden] { display: none; }

<body>
<div class="progress"><div class="in"><div class="count" id="count">0 / 0</div><div class="track"><div class="bar" id="bar"></div></div></div></div>

<script>
// Shared by index.html (design board) and play.html (play-test).
"use strict";

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const asList = v => v == null || v === "" ? [] : Array.isArray(v) ? v : [v];

// ---------- tiny markdown ----------
// idFn(id) renders a record ID found in the text; omit it to leave IDs as plain text.
function inline(s, idFn) {
  const codes = [];
  s = esc(s).replace(/`([^`]+)`/g, (m, c) => { codes.push(c); return `\u0000${codes.length - 1}\u0000`; });
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*\w])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, t, u) => /^(https?:|#)/.test(u) ? `<a href="${u}" target="_blank" rel="noopener">${t}</a>` : `<a href="../${u}" target="_blank">${t}</a>`);
  if (idFn) s = s.replace(/(^|[^\w-])((?:PR|ST|PZ|PP|Q|AS)-\d{3,})\b/g, (m, pre, id) => pre + idFn(id));
  return s.replace(/\u0000(\d+)\u0000/g, (m, i) => `<code>${codes[i]}</code>`);
}
function md(src, idFn) {
  src = String(src || "").replace(/<!--[^]*?-->/g, "");
  let html = "", para = [], list = null, code = null;
  const flushP = () => { if (para.length) { html += `<p>${inline(para.join(" "), idFn)}</p>`; para = []; } };
  const flushL = () => { if (list) { html += `<${list.t}>${list.items.map(i => `<li>${inline(i, idFn)}</li>`).join("")}</${list.t}>`; list = null; } };
  for (const ln of String(src || "").replace(/\r/g, "").split("\n")) {
    if (code) { if (/^```/.test(ln)) { html += `<pre><code>${esc(code.join("\n"))}</code></pre>`; code = null; } else code.push(ln); continue; }
    let m;
    if (/^```/.test(ln)) { flushP(); flushL(); code = []; continue; }
    if ((m = ln.match(/^(#{1,4})\s+(.*)/))) { flushP(); flushL(); const n = Math.min(m[1].length + 2, 6); html += `<h${n}>${inline(m[2], idFn)}</h${n}>`; continue; }
    if ((m = ln.match(/^\s*([-*]|\d+\.)\s+(.*)/))) {
      flushP(); const t = /\d/.test(m[1]) ? "ol" : "ul";
      if (!list || list.t !== t) { flushL(); list = { t, items: [] }; }
      list.items.push(m[2]); continue;
    }
    if ((m = ln.match(/^>\s?(.*)/))) { flushP(); flushL(); html += `<blockquote>${inline(m[1], idFn)}</blockquote>`; continue; }
    if (!ln.trim()) { flushP(); flushL(); continue; }
    if (list && /^\s{2,}/.test(ln)) { list.items[list.items.length - 1] += " " + ln.trim(); continue; }
    flushL(); para.push(ln.trim());
  }
  if (code) html += `<pre><code>${esc(code.join("\n"))}</code></pre>`;
  flushP(); flushL();
  return html;
}

// Text of a "## Heading" section in a record body (up to the next ## heading), or "".
function mdSection(body, heading) {
  const lines = String(body || "").replace(/\r/g, "").split("\n");
  const want = heading.trim().toLowerCase();
  let out = null;
  for (const ln of lines) {
    const m = ln.match(/^##\s+(.*)/);
    if (m) { if (out) break; if (m[1].trim().toLowerCase() === want) out = []; continue; }
    if (out) out.push(ln);
  }
  return out ? out.join("\n").trim() : "";
}
// Items of a list section, e.g. the "## Hints" ladder. Empty items are dropped.
function mdListItems(section) {
  return section.split("\n").map(l => l.match(/^\s*(?:[-*]|\d+\.)\s*(.*)$/)).filter(m => m && m[1].trim()).map(m => m[1].trim());
}

// ---------- site bar + light/dark toggle ----------
// Shares the "ebp-theme" choice with escapepack.ca. No choice stored = follow the OS setting.
(() => {
  const KEY = "ebp-theme";
  const dark = () => matchMedia("(prefers-color-scheme: dark)").matches;
  const current = () => document.documentElement.dataset.theme || (dark() ? "dark" : "light");
  const bar = document.createElement("div");
  bar.className = "sitebar";
  bar.innerHTML = '<a class="brand" href="https://escapepack.ca"><i aria-hidden="true"></i><span>Escape<br>Backpack</span></a><button class="theme-toggle" type="button"></button>';
  const SUN = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  const MOON = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>';
  const btn = bar.querySelector("button");
  const label = () => { const d = current() === "dark"; btn.innerHTML = d ? SUN : MOON; btn.title = d ? "Switch to light mode" : "Switch to dark mode"; btn.setAttribute("aria-label", d ? "Switch to light mode" : "Switch to dark mode"); };
  btn.addEventListener("click", () => {
    const next = current() === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem(KEY, next); } catch (e) {}
    label();
  });
  label();
  document.body.prepend(bar);
})();
</script>

ut": ["Postcard: Battle Harbour (Markland)", "Postcard: Qikiqtarjuaq, Baffin Island (Helluland)", "Magnifier"], "keep": [], "notes": [], "nested": [{"lock": 2, "where": "Locked pouch inside the front pocket"}]}], "start": [{"where": "Open back pocket of the backpack", "put": ["Postcard: L'Anse aux Meadows"]}], "startNotes": [], "check": [{"name": "Luggage tags A and B", "where": "On the outside of the backpack"}]};</script>
<script>
"use strict";
const R = window.RESET;
const $ = s => document.querySelector(s);
const KEY = "bp-reset:v1:" + R.name;
let done = {};
try { done = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (e) {} };

const letters = s => /[A-Za-z]/.test(s || "");
const spaced = s => esc(String(s).split("").join(" "));
function lockLine(st) {
  const code = st.code ? ` (code <span class="code">${spaced(st.code)}</span>)` : "";
  const show = st.display
    ? `leave it showing <span class="code">${spaced(st.display)}</span>`
    : `turn the ${letters(st.code) ? "letters" : "numbers"} away from the code`;
  return `Close it with <b>lock ${st.lock}</b>${code} and ${show}.`;
}
const list = items => items.length ? `<ul>${items.map(i => `<li>${esc(i)}</li>`).join("")}</ul>` : "";

function steps() {
  const out = R.steps.map(st => ({ id: st.id, html: `<h3>Lock ${st.lock}</h3><div class="where">${esc(st.where || "Container not recorded")}</div>
    ${st.put.length ? `<div>Put back inside:</div>${list(st.put)}` : st.nested.length ? "" : `<div>Nothing goes back in here.</div>`}
    ${st.nested.length ? `<div>Also put in, already locked:</div>${list(st.nested.map(x => `Lock ${x.lock}: ${x.where}`))}` : ""}
    ${st.keep.length ? `<p class="keep">Yours to keep: ${esc(st.keep.join(", "))}.</p>` : ""}
    ${st.notes.map(n => `<p class="note">${inline(n)}</p>`).join("")}
    <p class="lockline">${lockLine(st)}</p>` }));
  if (R.start.length || R.startNotes.length)
    out.push({ id: "start", html: `<h3>Starting position</h3><div class="where">What stays outside the locks for the next team</div>
      ${R.start.map(g => `<div>${esc(g.where)}:</div>${list(g.put)}`).join("")}
      ${R.startNotes.map(n => `<p class="note">${inline(n)}</p>`).join("")}` });
  if (R.check.length)
    out.push({ id: "check", html: `<h3>Last check</h3>${list(R.check.map(c => c.name + (c.where ? ": " + c.where.charAt(0).toLowerCase() + c.where.slice(1) : "")))}` });
  return out;
}

function render() {
  const all = steps(), n = all.filter(s => done[s.id]).length;
  $("#count").textContent = `${n} / ${all.length}`;
  $("#bar").style.width = all.length ? (100 * n / all.length) + "%" : "0";
  $("#view").innerHTML = `<div class="intro"><p>Thank you for packing the backpack back up for the next team!
      Work from the top: the last lock comes first, so every pouch is locked before the pocket around it closes.</p>
      ${R.general.map(g => `<p class="note">${inline(g)}</p>`).join("")}</div>
    ${all.map(s => `<section class="step${done[s.id] ? " done" : ""}">${s.html}
      <label class="tick"><input type="checkbox" data-step="${esc(s.id)}"${done[s.id] ? " checked" : ""}> Done</label></section>`).join("")}
    <div class="finished"${n === all.length && all.length ? "" : " hidden"}><h2 style="margin-top:0">All packed!</h2>
      <p>The backpack is ready for the next team. Thank you!</p><button class="btn" id="over">Start the checklist over</button></div>`;
}

document.addEventListener("change", e => {
  const id = e.target.dataset && e.target.dataset.step;
  if (!id) return;
  if (e.target.checked) done[id] = true; else delete done[id];
  save(); render();
});
document.addEventListener("click", e => { if (e.target.id === "over") { done = {}; save(); render(); window.scrollTo(0, 0); } });

$("#proj").textContent = R.name;
document.title = R.name + " · Reset checklist";
render();
</script>
</body>
